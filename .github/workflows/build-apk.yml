name: Build Agenda APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Find invalid placeholder
        run: |
          echo "Searching project for {str}..."
          grep -RFn --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build '{str}' . || true

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/agenda.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-apk
          path: app/build/outputs/apk/debug/agenda.apk
